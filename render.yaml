# Account-side setup and backup gates: docs/deployment.md.
# Connect the intended existing PostgreSQL database; this creates no database.
services:
  - type: web
    name: tacticsim
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploy manually after CI and backup review, never on an unchecked push.
    autoDeployTrigger: "off"
    # Use the image's startup script: migrate successfully, then serve requests.
    # No shell string override or paid pre-deploy hook is needed.
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: ReverseProxy__Enabled
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Prisma uses its direct TCP endpoint here; empty falls back to DefaultConnection.
      - key: ConnectionStrings__MigrationConnection
        sync: false
      - key: AllowedHosts
        sync: false
