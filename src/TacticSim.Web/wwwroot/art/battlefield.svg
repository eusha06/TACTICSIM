<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Original TacticSim miniature artwork. All shapes use upper-left light and
       lower-right shadows. Symbols share a 100 × 100 canvas, not gameplay scale. -->
  <defs>
    <linearGradient id="grass" x2=".7" y2="1">
      <stop stop-color="#b6bd83"/><stop offset="1" stop-color="#96a26b"/>
    </linearGradient>
    <linearGradient id="river" x2="1" y2="1">
      <stop stop-color="#32697a"/><stop offset="1" stop-color="#234e65"/>
    </linearGradient>
    <g id="tree" stroke="#385043" stroke-width="1.7" stroke-linejoin="round">
      <ellipse cx="5" cy="13" rx="15" ry="7" fill="#405e43" opacity=".22" stroke="none"/>
      <path d="M-2 4v15l5-2V3" fill="#81674b"/>
      <path d="M-13 2Q-19-7-10-13Q-11-23 0-24Q10-25 14-15Q23-10 17 0Q9 12-2 8Q-12 11-13 2Z" fill="#567557"/>
      <path d="M-12-8Q-12-19-1-20Q6-22 9-15Q1-16-1-7Q-8-11-12-8" fill="#789064" stroke="none"/>
      <path d="M-9 3Q1 7 7 0M8-13q6 2 5 8" fill="none" opacity=".5"/>
    </g>
    <g id="soldier" stroke="#263a3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="4" cy="19" rx="13" ry="5" fill="#203c32" opacity=".25" stroke="none"/>
      <path d="m-6 6-3 12 6 1 5-11 3 10 6-1-4-14" fill="#33454b"/>
      <path d="m-10-7 3 15 15-1 3-14-8-6Z" fill="var(--unit-color, #578aad)"/>
      <path d="m-9-7 3 5 9-2" fill="none" stroke="var(--unit-light, #a6d0e4)"/>
      <path d="M-2-9v14M-8 2l15-1" fill="none" opacity=".6"/>
      <path d="m-9-5-5 10 6 3 7-7 8-1" fill="var(--unit-color, #578aad)"/>
      <path d="m-4 1 21-8 2 4L-2 6Z" fill="#344148"/>
      <path d="m14-7 7-4" fill="none" stroke-width="3"/>
      <path d="M-7-14q0-10 8-10t9 10l-3 5-10 1Z" fill="#d6bb92"/>
      <path d="M-9-15q-1-14 10-14 12 1 12 14l-10 3Z" fill="var(--unit-color, #578aad)"/>
      <path d="M-5-22q4-5 9-2" fill="none" stroke="var(--unit-light, #a6d0e4)"/>
    </g>
    <g id="wheel" stroke="#263a3c" stroke-width="2.5">
      <ellipse rx="9" ry="14" fill="#344249"/>
      <ellipse cx="-2" cy="-1" rx="5" ry="9" fill="#a2a68b"/>
      <path d="M-2-9V7m-5-8H3"/>
    </g>
  </defs>
  <symbol id="plain" viewBox="0 0 100 100">
    <path fill="url(#grass)" d="M0 0h100v100H0Z"/>
    <g fill="none" stroke="#687c52" stroke-width="1.4" opacity=".45" stroke-linecap="round">
      <path d="m13 20 2-4 2 5m48-7 2-4 2 3M31 61l2-5 3 4m48 24 2-5 3 4M65 45l3-3 1 5M11 86l2-4 2 3"/>
    </g>
    <g fill="#e1d8a1" opacity=".65"><ellipse cx="45" cy="26" rx="2" ry="1"/><ellipse cx="73" cy="69" rx="2.5" ry="1.3"/><ellipse cx="23" cy="40" rx="1.5" ry="1"/></g>
  </symbol>
  <symbol id="forest" viewBox="0 0 100 100">
    <use href="#plain"/><path d="M8 32Q40 5 78 22t16 53Q54 104 12 80Z" fill="#6e895a" opacity=".5"/>
    <use href="#tree" transform="translate(28 34) scale(.9)"/>
    <use href="#tree" transform="translate(68 37) scale(1.03)"/>
    <use href="#tree" transform="translate(46 65) scale(1.2)"/>
    <use href="#tree" transform="translate(78 74) scale(.66)"/>
    <path d="m12 75 3-6 3 5M26 88l2-6 3 4" fill="none" stroke="#526a46" stroke-width="2"/>
  </symbol>
  <symbol id="hill" viewBox="0 0 100 100">
    <use href="#plain"/>
    <ellipse cx="55" cy="76" rx="40" ry="14" fill="#586346" opacity=".25"/>
    <path d="M8 72Q13 42 35 35Q45 9 65 24Q87 37 92 70Q64 93 30 86Z" fill="#918867" stroke="#777453" stroke-width="1.5"/>
    <path d="M8 72Q14 43 35 35Q43 14 59 22Q47 24 47 45L27 61Z" fill="#c2b58a"/>
    <path d="M27 70Q34 49 50 47Q54 32 67 33M21 78Q46 86 74 70M39 65q17 8 33-8" fill="none" stroke="#d2c497" stroke-width="2" opacity=".8"/>
    <path d="m73 78 3-5 4 1-1 5Z" fill="#726e57"/>
    <path d="m73 75 3-2 4 1-5 2Z" fill="#d3c398"/>
  </symbol>
  <symbol id="water" viewBox="0 0 100 100">
    <path fill="url(#river)" d="M0 0h100v100H0Z"/>
    <g fill="none" stroke="#7da8ad" stroke-width="1.5" opacity=".4" stroke-linecap="round">
      <path d="M12 24q9-4 19-1m24 32q13-5 26-1M5 78q9-4 18-1m27-65 16-2M74 87l15-2"/>
    </g>
    <g fill="none" stroke="#153f56" opacity=".3"><path d="m24 48 22-3m-6 44 15-2m23-54 17-2"/></g>
  </symbol>
  <!-- Only rendered on a water edge with land outside it. Adjacent water shares
       the full cell edge. No bridges, fords, paths or occupancy are invented. -->
  <symbol id="shore" viewBox="0 0 100 100">
    <path d="M0 0h100v5Q75 9 50 5T0 7Z" fill="#aaa779"/>
    <path d="M0 7Q25 3 50 5t50 0" fill="none" stroke="#a3beb1" stroke-width="2" opacity=".6"/>
  </symbol>
  <symbol id="outpost" viewBox="0 0 100 100">
    <ellipse cx="56" cy="75" rx="35" ry="13" fill="#344b39" opacity=".3"/>
    <g stroke="#34433a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M22 49 52 35 80 47 50 62Z" fill="#e4d6a4"/>
      <path d="M22 49v23l28 15V62Z" fill="#b5a16e"/>
      <path d="m50 62 30-15v24L50 87Z" fill="#927a54"/>
      <path d="m18 48 32-19 35 16-33 19Z" fill="#e6cd84"/>
      <path d="m52 64 33-19-4 7-29 18Z" fill="#a7854e"/>
      <path d="M30 60v11l10 5V65Z" fill="#36535b"/>
      <path d="M61 65v13l10-6V59Z" fill="#445454"/>
      <path d="M57 37V12M51 16l13-7M50 26l13-7" fill="none" stroke-width="3"/>
      <path d="M40 9q-9 7-3 16M74 4q9 7 5 17" fill="none" stroke="#f6e7ac" stroke-width="3"/>
    </g>
  </symbol>
  <symbol id="infantry" viewBox="0 0 100 100">
    <ellipse cx="53" cy="81" rx="40" ry="10" fill="#263a30" opacity=".2"/>
    <use href="#soldier" transform="translate(28 43) scale(.85)"/>
    <use href="#soldier" transform="translate(67 48) scale(.85)"/>
    <use href="#soldier" transform="translate(44 68)"/>
  </symbol>
  <symbol id="armor" viewBox="0 0 100 100">
    <ellipse cx="54" cy="80" rx="41" ry="12" fill="#263a30" opacity=".25"/>
    <g stroke="#263a3c" stroke-width="2.2" stroke-linejoin="round">
      <path d="m17 50 12-17 56 12 5 24-13 14-56-12Z" fill="#303e43"/>
      <path d="m20 58 6 10 51 11 9-12-2-11" fill="#647174"/>
      <path d="m25 59 3 7m7-5 3 7m7-5 3 7m7-5 3 7m7-5 3 7m8-12-3 8" fill="none" stroke="#25373c" stroke-width="3"/>
      <path d="m15 44 15-18 52 13 6 22-16 12-53-13Z" fill="var(--unit-color, #578aad)"/>
      <path d="m15 44 53 13 14-18-52-13Z" fill="var(--unit-light, #a6d0e4)"/>
      <path d="m68 57 4 16 16-12-6-22Z" fill="#203541" opacity=".32" stroke="none"/>
      <path d="m36 37 8-12 24 6 6 13-11 9-25-6Z" fill="var(--unit-color, #578aad)"/>
      <path d="m36 37 25 6 7-12-24-6Z" fill="var(--unit-light, #a6d0e4)"/>
      <path d="m45 36-30-17-4 7 30 17Z" fill="var(--unit-light, #a6d0e4)"/>
      <path d="m11 25 4-7-6-3-5 7Z" fill="#384b50"/>
      <ellipse cx="55" cy="34" rx="5" ry="3" fill="#415866"/>
      <path d="m30 49 15 4m9 3 8 2" fill="none" stroke="#e6edcf" opacity=".85"/>
      <path d="m73 37 1-18" fill="none" stroke-width="1.5"/>
    </g>
  </symbol>
  <symbol id="artillery" viewBox="0 0 100 100">
    <ellipse cx="53" cy="82" rx="39" ry="10" fill="#263a30" opacity=".25"/>
    <g stroke="#263a3c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="m49 54 33 25-7 6-34-24Z" fill="var(--unit-color, #578aad)"/>
      <path d="m43 58 10 29-8 2-13-29" fill="var(--unit-light, #a6d0e4)"/>
      <use href="#wheel" transform="translate(69 56) rotate(-20)"/>
      <path d="m32 42 17-7 19 13-3 19-18 5-20-17Z" fill="var(--unit-color, #578aad)"/>
      <path d="m32 42 17-7 19 13-20 6Z" fill="var(--unit-light, #a6d0e4)"/>
      <path d="M44 52 16 21l8-7 29 32Z" fill="var(--unit-light, #a6d0e4)"/>
      <path d="m16 21-5-7 9-7 5 7Z" fill="#3c5055"/>
      <path d="m22 21 24 27" fill="none" stroke="#e3ead5" stroke-width="1.5"/>
      <use href="#wheel" transform="translate(29 66) rotate(-20)"/>
      <path d="m52 57 8 3m-2-13 2 7" fill="none"/>
    </g>
  </symbol>
</svg>
